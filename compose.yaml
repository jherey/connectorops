name: connectorops

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connectorops-local-only}
      POSTGRES_USER: ${POSTGRES_USER:-connectorops}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}',
        ]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - 127.0.0.1::5432
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-create-acmecrm.sh:ro

  acme-api:
    build:
      context: .
      dockerfile: apps/acme-api/Dockerfile
    environment:
      ACME_API_KEY: ${ACME_API_KEY:-connectorops-local-partner-key}
      ACME_CONTROL_TOKEN: ${ACME_CONTROL_TOKEN:-connectorops-local-control-token}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-connectorops}:${POSTGRES_PASSWORD:-connectorops-local-only}@postgres:5432/acmecrm
      HOST: 0.0.0.0
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/healthz/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - 127.0.0.1:${ACME_API_PORT:-3001}:3001
    restart: unless-stopped

  n8n:
    build:
      context: .
      dockerfile: docker/n8n/Dockerfile
      args:
        N8N_VERSION: 2.44.5
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-connectorops-local-only}
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-connectorops}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Etc/UTC}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-connectorops-local-encryption-key-change-before-deploying}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_HOST: localhost
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: 268435456
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: 1000
      N8N_RUNNERS_TASK_TIMEOUT: 60
      N8N_UNVERIFIED_PACKAGES_ENABLED: 'true'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
    depends_on:
      acme-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 3s
      timeout: 5s
      retries: 30
    ports:
      - 127.0.0.1:${N8N_PORT:-5678}:5678
    restart: unless-stopped
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
  postgres_data:
