name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run validate

  containers:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Pack application artifacts
        run: npm run artifacts:pack
      - name: Start local topology
        run: npm run compose:up
      - name: Verify readiness
        run: npm run smoke
      - name: Show service logs after failure
        if: failure()
        run: npm run compose:logs
      - name: Stop local topology
        if: always()
        run: node scripts/compose.mjs down --volumes
